bookdown::bs4_book:
  theme:
    primary: "#0F6E7B"
    bg: "#FFFFFF"
    fg: "#1E2A32"
  css: ["assets/style.css"]
  includes:
    in_header: "assets/head.html"
    after_body: "assets/foot.html"
  # Uncomment once this wiki lives in a git repository. bs4_book will then add
  # an "Edit this page" link to every chapter, which is the fastest route for
  # contributors (see the Contribute chapter).
  # repo:
  #   base: https://github.com/YOUR-ORG/TADA-Wiki
  #   branch: main
  split_bib: false
