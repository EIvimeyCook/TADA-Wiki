bookdown::bs4_book:
  theme:
    primary: "#0F6E7B"
    bg: "#FFFFFF"
    fg: "#1E2A32"
  css: ["assets/style.css"]
  includes:
    in_header: "assets/head.html"
    after_body: "assets/foot.html"
  # Drives the "View source" / "Edit this page" links in the page footer.
  repo:
    base: https://github.com/EIvimeyCook/TADA-Wiki
    branch: main
    icon: "fab fa-github"
  split_bib: false
